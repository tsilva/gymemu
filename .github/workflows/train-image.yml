name: Training image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested immutable image for this ref to GHCR
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'gymemu/**'
      - 'configs/**'
      - 'start_states/**'
      - 'containers/train/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.dockerignore'
      - '.github/workflows/train-image.yml'
  pull_request:
    paths:
      - 'containers/train/**'
      - '.dockerignore'
      - '.github/workflows/train-image.yml'

permissions:
  contents: read

concurrency:
  group: train-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tsilva/gymemu/train
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room for CUDA layers on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Authenticate to GHCR
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build locked Linux runtime
        run: |
          docker buildx build --progress plain --platform linux/amd64 --load \
            --file containers/train/Dockerfile \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "type=registry,ref=$IMAGE:main" .
      - name: Train, reload and play on CPU
        run: |
          mkdir -p "$RUNNER_TEMP/gymemu-verification"
          docker run --rm --shm-size 1g \
            -v "$RUNNER_TEMP/gymemu-verification:/workspace" \
            "$IMAGE:sha-$GITHUB_SHA" smoke --device cpu
      - name: Publish tested image
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main"
            docker push "$IMAGE:main"
          fi
          docker inspect --format "{{index .RepoDigests 0}}" "$IMAGE:sha-$GITHUB_SHA" > "$RUNNER_TEMP/image-ref.txt"
          printf 'Training image: %s\n' "$(cat "$RUNNER_TEMP/image-ref.txt")" >> "$GITHUB_STEP_SUMMARY"
