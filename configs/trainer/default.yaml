epochs: 10
batch_size: 32
learning_rate: 0.001
device: auto
threads: null
workers: 0
precision: fp32
checkpoint_seconds: 60
limit_episodes: null
train_batches: null
eval_batches: null
frame_cache: null
compile: false
compile_layout_optimization: true
prefetch: false
sync_batches: 1
loader: standard

# Read-only diagnostics; fixed probes use held-out data and never change the loss.
diagnostics:
  enabled: true
  log_every: 100
  probe_every: 1000
  samples: 8
  horizon: 32
