defaults:
  - game: breakout
  - model: direct_cnn
  - approach: direct
  - trainer: default
  - optimizer: adam
  - _self_
  - recipe: null
  - experiment: null

name: ${game.name}-${approach.kind}
history: 8
seed: 47
output: null
resume: null
run_id: null
goal_overrides: {}
launch_overrides: []
# Saved run recipes fill this to detect changed dataset content on replay.
expected_dataset: null

wandb:
  mode: online
  entity: null
  name: ${name}
  group: null
  tags: []

r2:
  enabled: true
  bucket: gymemu
  prefix: runs
  public_bucket: gymemu-public
  public_base_url: https://gymemu-assets.tsilva.eu

hydra:
  job:
    chdir: false
  run:
    dir: runs/${name}/${now:%Y-%m-%d_%H-%M-%S-%f}
  sweep:
    dir: runs/sweeps/${name}/${now:%Y-%m-%d_%H-%M-%S-%f}
    subdir: ${hydra.job.num}
