[project]
name = "gymemu"
version = "0.1.0"
description = "Play retro games through a learned spatial latent world model"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch",
    "numpy",
    "pillow",
    "pygame",
    "python-dotenv",
    "huggingface_hub",
    "datasets",
    "tqdm",
    "wandb",
]

[tool.pip]
extra-index-url = ["https://download.pytorch.org/whl/cu118"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
