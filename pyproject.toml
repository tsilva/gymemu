[project]
name = "gymemu"
version = "0.1.0"
readme = "README.md"
description = "Train, compare, and play configurable neural emulator pipelines from trajectory datasets"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "torch>=2.13.0,<3",
    "numpy>=2,<3",
    "pillow>=12.3.0,<13",
    "pyarrow>=19,<24",
    "huggingface-hub>=0.34,<2",
    "hydra-core>=1.3.2,<1.4",
    "wandb>=0.21,<1",
    "boto3>=1.40,<2",
]

[project.optional-dependencies]
monitoring = ["wandb-workspaces>=0.4.5,<0.5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "click>=8.3.3",
    "gitpython>=3.1.58",
    "guardrails-ai!=0.10.1",
    "idna>=3.15",
    "mistralai!=2.4.6",
    "pygments>=2.20",
    "setuptools>=83",
    "urllib3>=2.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
gymemu = "gymemu.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gymemu"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "gymemu/configs"
"start_states" = "gymemu/start_states"
"pyproject.toml" = "gymemu/pyproject.toml"
"uv.lock" = "gymemu/uv.lock"

[tool.hatch.build.targets.sdist]
include = ["/gymemu", "/configs", "/start_states", "/README.md", "/LICENSE", "/uv.lock"]
