[project]
name = "gymemu"
version = "0.1.0"
description = "Play retro games through a learned spatial latent world model"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch>=2.13.0",
    "numpy",
    "pillow>=12.3.0",
    "pygame",
    "python-dotenv>=1.2.2",
    "huggingface_hub",
    "datasets",
    "tqdm",
    "wandb>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.4",
]

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "context_corruption",
    "dataset_utils",
    "device_utils",
    "game_config",
    "main",
    "modal_train",
    "preprocessing",
    "rollout_dataset",
    "rollout_feedback",
    "spatial_model",
    "train",
    "wandb_utils",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "aiohttp>=3.14.3",
  "gitpython>=3.1.58",
  "guardrails-ai!=0.10.1",
  "idna>=3.15",
  "mistralai!=2.4.6",
  "pygments>=2.20",
  "setuptools>=83",
  "urllib3>=2.7",
]
